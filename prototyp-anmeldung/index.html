<!--
  Klickbarer Prototyp der Helferanmeldung – Schritt 0.2 im Lastenheft
  (docs/lastenheft-helferanmeldung.md). Zum Ausprobieren mit Helfern, die
  nicht IT-affin sind (Schritt 0.3, siehe testleitfaden.md daneben).

  Eine Datei, keine Abhängigkeiten, nichts geht ins Netz: einfach im Browser
  öffnen oder aufs Handy schicken. Alles bleibt im Speicher dieses Tabs.
  Die Schichten sind Beispieldaten auf die Tage der AA 2027.

  Bewusst NICHT wie das echte Werkzeug gebaut: hier steuert JavaScript alles,

<script>
"use strict";

// --- Beispieldaten ----------------------------------------------------------

const VERANSTALTUNG = "Absolute Abfahrt 2027";

const TAGE = [
  { datum: "2027-06-29", name: "Dienstag", kurz: "Di 29.6.", art: "Aufbau" },
  { datum: "2027-06-30", name: "Mittwoch", kurz: "Mi 30.6.", art: "Aufbau" },
  { datum: "2027-07-01", name: "Donnerstag", kurz: "Do 1.7.", art: "Veranstaltung" },
  { datum: "2027-07-02", name: "Freitag", kurz: "Fr 2.7.", art: "Veranstaltung" },
  { datum: "2027-07-03", name: "Samstag", kurz: "Sa 3.7.", art: "Veranstaltung" },
  { datum: "2027-07-04", name: "Sonntag", kurz: "So 4.7.", art: "Veranstaltung" },
  { datum: "2027-07-05", name: "Montag", kurz: "Mo 5.7.", art: "Abbau" },
];

// Fenster in Minuten ab Mitternacht des Tages. Sie überlappen mit Absicht:
// eine Schicht von 8 bis 14 Uhr soll auch zu „Früh“ allein passen.
const TAGESZEITEN = [
  { key: "frueh", name: "Vormittag", spanne: "bis 13 Uhr", fenster: [300, 780] },
  { key: "mittag", name: "Nachmittag", spanne: "12 bis 18 Uhr", fenster: [720, 1080] },
  { key: "abend", name: "Abend", spanne: "ab 17 Uhr", fenster: [1020, 1620] },
];

const BEREICHE = {
  aufbau: { name: "Aufbau und Abbau", text: "Zelte, Zäune, Banner – aufbauen und wieder abbauen.", treffpunkt: "Orgazelt", vorlieben: ["anpacken"] },
  zeltplatz: { name: "Ordner Zeltplatz", text: "Plätze zeigen, Fragen beantworten, abends auf Ruhe achten.", treffpunkt: "Einfahrt Zeltplatz", vorlieben: ["menschen"] },
  strecke: { name: "Streckenposten", text: "Zuschauer von der Strecke fernhalten, Stürze per Funk melden.", treffpunkt: "Orgazelt", vorlieben: ["strecke"] },
  sperre: { name: "Straßensperre", text: "Nur durchlassen, wer auf der Liste steht.", treffpunkt: "Straßensperre am Ortseingang", vorlieben: ["strecke", "menschen"] },
  shuttle: { name: "Shuttle", text: "Gäste zwischen Parkplatz und Gelände fahren. Mit Führerschein.", treffpunkt: "Großer Parkplatz", vorlieben: ["fahren"], abAlter: 18 },
  merch: { name: "Merchandise", text: "Shirts und Andenken verkaufen.", treffpunkt: "Merch-Stand am Zielbereich", vorlieben: ["menschen"] },
  wiese: { name: "Absoluter Wiesenslalom", text: "Kinderrennen: Start, Ziel und Tore.", treffpunkt: "Kinderwiese", vorlieben: ["menschen", "strecke"] },
};

const VORLIEBEN = [
  { key: "strecke", name: "Draußen an der Strecke" },
  { key: "menschen", name: "Mit Menschen" },
  { key: "anpacken", name: "Anpacken – Auf- und Abbau" },
  { key: "fahren", name: "Fahren – Shuttle, ab 18" },
  { key: "egal", name: "Egal – setzt mich ein, wo es brennt" },
];

// id, Bereich, Tag, von, bis, Soll, Minimum, Reserve, schon belegt
const SCHICHTEN = [
  ["a1", "aufbau", "2027-06-29", "08:00", "14:00", 10, 6, 2, 4],
  ["a2", "aufbau", "2027-06-30", "08:00", "14:00", 10, 6, 2, 7],
  ["a3", "aufbau", "2027-06-30", "14:00", "20:00", 8, 5, 2, 8],
  ["a4", "aufbau", "2027-07-05", "08:00", "14:00", 12, 8, 2, 3],
  ["z1", "zeltplatz", "2027-07-01", "14:00", "20:00", 4, 3, 1, 4],
  ["z2", "zeltplatz", "2027-07-02", "08:00", "14:00", 4, 3, 1, 2],
  ["z3", "zeltplatz", "2027-07-02", "14:00", "20:00", 5, 3, 1, 5],
  ["z4", "zeltplatz", "2027-07-02", "20:00", "02:00", 3, 2, 1, 1],
  ["z5", "zeltplatz", "2027-07-03", "08:00", "14:00", 4, 3, 1, 3],
  ["z6", "zeltplatz", "2027-07-03", "14:00", "20:00", 5, 3, 1, 6],
  ["z7", "zeltplatz", "2027-07-03", "20:00", "02:00", 3, 2, 1, 0],
  ["z8", "zeltplatz", "2027-07-04", "08:00", "14:00", 4, 3, 1, 2],
  ["s1", "strecke", "2027-07-02", "08:00", "13:00", 12, 10, 2, 9],
  ["s2", "strecke", "2027-07-03", "08:00", "13:00", 18, 15, 3, 16],
  ["s3", "strecke", "2027-07-03", "13:00", "18:00", 18, 15, 3, 11],
  ["s4", "strecke", "2027-07-04", "08:00", "13:00", 18, 15, 3, 18],
  ["s5", "strecke", "2027-07-04", "13:00", "18:00", 18, 15, 3, 14],
  ["p1", "sperre", "2027-07-02", "06:00", "12:00", 4, 3, 1, 4],
  ["p2", "sperre", "2027-07-02", "12:00", "18:00", 4, 3, 1, 2],
  ["p3", "sperre", "2027-07-03", "06:00", "12:00", 4, 3, 1, 3],
  ["p4", "sperre", "2027-07-03", "12:00", "18:00", 4, 3, 1, 1],
  ["p5", "sperre", "2027-07-04", "06:00", "12:00", 4, 3, 1, 4],
  ["p6", "sperre", "2027-07-04", "12:00", "18:00", 4, 3, 1, 3],
  ["f1", "shuttle", "2027-07-02", "07:00", "13:00", 3, 2, 1, 2],
  ["f2", "shuttle", "2027-07-03", "07:00", "13:00", 3, 2, 1, 1],
  ["f3", "shuttle", "2027-07-03", "13:00", "19:00", 3, 2, 1, 3],
  ["f4", "shuttle", "2027-07-04", "07:00", "13:00", 3, 2, 1, 0],
  ["m1", "merch", "2027-07-03", "10:00", "14:00", 2, 1, 1, 2],
  ["m2", "merch", "2027-07-03", "14:00", "18:00", 2, 1, 1, 1],
  ["m3", "merch", "2027-07-04", "10:00", "14:00", 2, 1, 1, 0],
  ["w1", "wiese", "2027-07-03", "15:00", "18:00", 5, 3, 1, 2],
].map(([id, bereich, tag, von, bis, soll, minimum, reserve, belegt]) =>
  ({ id, bereich, tag, von, bis, soll, minimum, reserve, belegt }));

// Belohnungen dieser Veranstaltung (G-02). Leer = keine Goodies (V-07).
// Jede Schicht bringt Kudos; `kurz` steht im Kreis, `text` im Satz.
const STUFEN = [
  { ab: 1, text: "Helfershirt", kurz: "Shirt" },
  { ab: 2, text: "Bier am Bierwagen", kurz: "Bier", abAlter: 16, alternative: "Eis", alternativeKurz: "Eis" },
  { ab: 4, text: "ILRC-Cap", kurz: "Cap" },
];

const ERSTER_TAG = "2027-07-01";
const ORGA_TELEFON = "0123 456789";

// --- Zustand ----------------------------------------------------------------

const LEER = () => ({
  auswahl: [],        // Schicht-ids
  zeit: [],           // "datum|tageszeit"
  vorlieben: [],
  springer: [],       // "datum|tageszeit", wenn als Springer eingetragen
  person: {},
  weitere: [],
  stamm: false,
  whatsapp: false,    // Opt-in: in die WhatsApp-Helfergruppe einladen
  bestaetigt: false,
  abgemeldet: false,
  geloescht: false,
  meldung: "",
  filterTag: "",
  filterBereich: "",
  offen: "",          // id der Schicht, deren Rückfrage gerade offen ist
  umbuchen: "",       // id der Schicht, die umgebucht wird
});

let z = laden();

function laden() {
  try {
    const roh = sessionStorage.getItem("prototyp-anmeldung");
    if (roh) return Object.assign(LEER(), JSON.parse(roh));
  } catch (e) { /* privater Modus o. Ä. – dann eben ohne */ }
  return LEER();
}

function sichern() {
  try { sessionStorage.setItem("prototyp-anmeldung", JSON.stringify(z)); } catch (e) { /* egal */ }
}

// --- Hilfen -----------------------------------------------------------------

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const tag = datum => TAGE.find(t => t.datum === datum);
const schicht = id => SCHICHTEN.find(s => s.id === id);
const minuten = hhmm => Number(hhmm.slice(0, 2)) * 60 + Number(hhmm.slice(3, 5));
const uhr = hhmm => String(Number(hhmm.slice(0, 2)));

function spanne(s) {
  // Absolute Minuten ab dem ersten Tag; Nachtschichten enden am Folgetag.
  const basis = TAGE.findIndex(t => t.datum === s.tag) * 1440;
  const von = basis + minuten(s.von);
  let bis = basis + minuten(s.bis);
  if (bis <= von) bis += 1440;
  return [von, bis];
}

function zeitText(s) {
  const nacht = minuten(s.bis) <= minuten(s.von);
  return `${tag(s.tag).kurz} · ${uhr(s.von)}–${uhr(s.bis)} Uhr${nacht ? " (Nacht)" : ""}`;
}

function stunden(s) {
  const [von, bis] = spanne(s);
  return (bis - von) / 60;
}

function lage(s) {
  const frei = s.soll - s.belegt;
  const reserveFrei = s.soll + s.reserve - s.belegt;
  if (frei > 0) return { art: "frei", frei, dringend: s.belegt < s.minimum };
  if (reserveFrei > 0) return { art: "reserve", frei: reserveFrei, dringend: false };
  return { art: "voll", frei: 0, dringend: false };
}

function ueberschneidung(s, ohne) {
  // Welche gewählte Schicht sich mit s überschneidet – ohne die, die gerade
  // umgebucht wird (S-02).
  const [a, b] = spanne(s);
  return z.auswahl
    .filter(id => id !== s.id && id !== ohne)
    .map(schicht)
    .find(t => { const [c, d] = spanne(t); return a < d && c < b; });
}

function alterVon(g) {
  const [j, m, t] = g.split("-").map(Number);
  const [ej, em, et] = ERSTER_TAG.split("-").map(Number);
  let a = ej - j;
  if (em < m || (em === m && et < t)) a -= 1;
  return a;
}

// Das Geburtsdatum fragen wir nur bei Minderjährigen. Wer „18 oder älter“
// sagt, gilt als volljährig – für alle Altersgrenzen genügt das.
function alterDer(p) {
  if (p.volljaehrig === "ja") return 99;
  if (p.volljaehrig === "nein" && p.geburt) return alterVon(p.geburt);
  return null;
}

function alter() {
  return alterDer(z.person);
}

function stufeText(stufe, kurz = false) {
  // Solange das Alter unbekannt ist, beides nennen: „Bier am Bierwagen oder
  // Eis“, im Kreis „Bier/Eis“.
  const text = kurz ? stufe.kurz : stufe.text;
  if (!stufe.abAlter) return text;
  const alternative = kurz ? stufe.alternativeKurz : stufe.alternative;
  const a = alter();
  if (a === null) return kurz ? `${text}/${alternative}` : `${text} oder ${alternative}`;
  return a < stufe.abAlter ? alternative : text;
}

function nochBis(stufe, anzahl, kurz) {
  const fehlt = stufe.ab - anzahl;
  return `Noch ${fehlt === 1 ? "eine Schicht" : `${fehlt} Schichten`} bis: ${esc(stufeText(stufe, kurz))}`;
}

function kudos() {
  return z.auswahl.length + (z.springer.length ? 1 : 0);
}

function zuJung(s) {
  const a = alter();
  const grenze = BEREICHE[s.bereich].abAlter;
  return grenze && a !== null && a < grenze;
}

function waehlbar(s, ohne) {
  if (z.auswahl.includes(s.id)) return { ok: false, grund: "" };
  const kollision = ueberschneidung(s, ohne);
  if (kollision) return { ok: false, grund: `Überschneidet sich mit ${BEREICHE[kollision.bereich].name}, ${zeitText(kollision)}.` };
  if (lage(s).art === "voll") return { ok: false, grund: "Voll – auch die Reserveplätze sind vergeben." };
  if (zuJung(s)) return { ok: false, grund: `Erst ab ${BEREICHE[s.bereich].abAlter} Jahren.` };
  return { ok: true, grund: "" };
}

function passtZurZeit(s) {
  // Mindestens drei Viertel der Schicht liegen in angetippten Zeiten. Eine
  // Nachtschicht gehört zum Abend ihres ersten Tages.
  const basis = TAGE.findIndex(t => t.datum === s.tag) * 1440;
  const fenster = TAGESZEITEN
    .filter(tz => z.zeit.includes(`${s.tag}|${tz.key}`))
    .map(tz => [basis + tz.fenster[0], basis + tz.fenster[1]])
    .sort((a, b) => a[0] - b[0]);
  const vereint = [];
  fenster.forEach(f => {
    const letztes = vereint[vereint.length - 1];
    if (letztes && f[0] <= letztes[1]) letztes[1] = Math.max(letztes[1], f[1]);
    else vereint.push(f.slice());
  });
  const [von, bis] = spanne(s);
  const drin = vereint.reduce((n, [a, b]) => n + Math.max(0, Math.min(b, bis) - Math.max(a, von)), 0);
  return drin >= 0.75 * (bis - von);
}

function passtZuVorlieben(s) {
  if (!z.vorlieben.length || z.vorlieben.includes("egal")) return true;
  return BEREICHE[s.bereich].vorlieben.some(v => z.vorlieben.includes(v));
}

function dringlichkeit(s) {
  const l = lage(s);
  if (l.dringend) return 0;
  if (l.art === "frei") return 1;
  return 2;
}

function vorschlaege() {
  return SCHICHTEN
    .filter(s => passtZurZeit(s) && passtZuVorlieben(s))
    .filter(s => waehlbar(s).ok || z.auswahl.includes(s.id))
    .sort((a, b) => dringlichkeit(a) - dringlichkeit(b) || spanne(a)[0] - spanne(b)[0]);
}

function nochEine() {
  // G-03: am liebsten direkt davor oder danach am selben Ort, dann derselbe
  // Tag, dann was dringend gebraucht wird.
  const gewaehlt = z.auswahl.map(schicht);
  const nah = s => gewaehlt.some(g => g.bereich === s.bereich && g.tag === s.tag &&
    (g.bis === s.von || g.von === s.bis));
  const gleicherTag = s => gewaehlt.some(g => g.tag === s.tag);
  // Nichts vorschlagen, was den Tag über 10 Stunden bringt (K-03).
  const amTag = s => gewaehlt.filter(g => g.tag === s.tag).reduce((n, g) => n + stunden(g), 0);
  return SCHICHTEN
    .filter(s => waehlbar(s).ok && amTag(s) + stunden(s) <= 10)
    .sort((a, b) =>
      (nah(b) - nah(a)) || (gleicherTag(b) - gleicherTag(a)) ||
      (dringlichkeit(a) - dringlichkeit(b)) || (spanne(a)[0] - spanne(b)[0]))
    .slice(0, 3);
}

function tagesbalken() {
  return TAGE.filter(t => t.art === "Veranstaltung").map(t => {
    const liste = SCHICHTEN.filter(s => s.tag === t.datum);
    const soll = liste.reduce((n, s) => n + s.soll, 0);
    const belegt = liste.reduce((n, s) => n + Math.min(s.belegt + (z.auswahl.includes(s.id) ? 1 : 0), s.soll), 0);
    return { t, soll, belegt };
  });
}

function kopf(titel, zurueck) {
  return `<div class="kopf">
    ${zurueck ? `<a class="zurueck" href="${zurueck}">‹ Zurück</a>` : ""}
    <p class="veranstaltung">${VERANSTALTUNG} · 1. bis 4. Juli</p>
    <h1>${titel}</h1>
  </div>`;
}

function fuss() {
  return `<p class="fuss">Fragen? Ruf uns an: <a href="tel:${ORGA_TELEFON.replace(/ /g, "")}">${ORGA_TELEFON}</a></p>`;
}

function marken(s) {
  const l = lage(s);
  if (z.auswahl.includes(s.id)) {
    return `<span class="marke frei">Du bist dabei${l.art === "reserve" ? " – als Reserve" : ""}</span>`;
  }
  let m = "";
  if (l.dringend) m += `<span class="marke dringend">Dringend gesucht</span>`;
  if (l.art === "frei") m += `<span class="marke frei">noch ${l.frei} frei</span>`;
  if (l.art === "reserve") m += `<span class="marke reserve">als Reserve</span>`;
  if (l.art === "voll") m += `<span class="marke voll">voll</span>`;
  if (BEREICHE[s.bereich].abAlter) m += `<span class="marke voll">ab ${BEREICHE[s.bereich].abAlter}</span>`;
  return m;
}

function schichtKarte(s, opt = {}) {
  const gewaehlt = z.auswahl.includes(s.id);
  const w = waehlbar(s, opt.ohne);
  const gesperrt = !gewaehlt && !w.ok;
  const b = BEREICHE[s.bereich];
  let knopf = "";
  if (opt.knopf === "tauschen") {
    knopf = `<button class="knopf klein" data-aktion="tauschen" data-id="${s.id}">Diese nehmen</button>`;
  } else if (gewaehlt) {
    knopf = `<button class="knopf klein zweit" data-aktion="abwaehlen" data-id="${s.id}">✓ Gewählt – abwählen</button>`;
  } else if (w.ok) {
    knopf = `<button class="knopf klein" data-aktion="waehlen" data-id="${s.id}">${lage(s).art === "reserve" ? "Als Reserve eintragen" : "Eintragen"}</button>`;
  }
  return `<div class="karte schicht${gewaehlt ? " gewaehlt" : ""}${gesperrt ? " gesperrt" : ""}">
    <h3>${b.name}</h3>
    <div class="zeit">${zeitText(s)}</div>
    <div class="ort">Treffpunkt: ${b.treffpunkt}</div>
    ${opt.mitText ? `<p class="leise">${b.text}</p>` : ""}
    <div>${marken(s)}</div>
    ${gesperrt && w.grund ? `<div class="grund">${w.grund}</div>` : ""}
    ${knopf}
  </div>`;
}

function kudosKarte() {
  if (!STUFEN.length) return "";
  const anzahl = kudos();
  // Ein Kreis je Schicht bis zur letzten Belohnung, nicht mehr – sonst bricht
  // die Reihe auf dem Handy um. Im Kreis steht, was es dafür gibt; was schon
  // sicher ist, ist grün.
  const felder = STUFEN[STUFEN.length - 1].ab;
  let html = `<div class="kudos">`;
  for (let i = 1; i <= felder; i++) {
    const stufe = STUFEN.find(s => s.ab === i);
    const name = stufe ? esc(stufeText(stufe, true)) : "";
    html += i <= anzahl ? `<div class="voll">${name || "✓"}</div>` : `<div>${name}</div>`;
  }
  html += `</div>`;
  const naechste = STUFEN.find(s => s.ab > anzahl);
  html += naechste ? `<p>${nochBis(naechste, anzahl, false)}.</p>` : `<p>Alle Goodies sind deine. Danke!</p>`;
  return html;
}

function anreiz() {
  // Kleine Kreise schon beim Auswählen: zeigt, dass mehr Schichten mehr
  // bringen, bevor überhaupt jemand die Kudos gesehen hat (G-10).
  if (!STUFEN.length) return "";
  const anzahl = kudos();
  const felder = STUFEN[STUFEN.length - 1].ab;
  let mini = "";
  for (let i = 1; i <= felder; i++) mini += `<i class="${i <= anzahl ? "voll" : ""}"></i>`;
  const naechste = STUFEN.find(s => s.ab > anzahl);
  const text = naechste ? nochBis(naechste, anzahl, true) : "Alle Goodies sind deine";
  return `<div class="anreiz"><span class="mini">${mini}</span><span>${text}</span></div>`;
}

function leiste() {
  const n = z.auswahl.length;
  if (!n && !z.springer.length) return "";
  const ziel = z.bestaetigt ? "#mein" : "#angaben";
  const text = z.bestaetigt ? "Fertig – zu meinem Helferplatz"
    : n ? `Weiter mit ${n} ${n === 1 ? "Schicht" : "Schichten"}` : "Weiter als Springer";
  return `<div class="leiste">
    ${anreiz()}
    <a class="knopf" href="${ziel}">${text}</a>
  </div>`;
}

    }
    return `<div class="karte schicht">
      <h3>${b.name}</h3>
      <div class="zeit">${zeitText(s)}</div>
      <div class="ort">Treffpunkt: ${b.treffpunkt} · 15 Min. vorher</div>
      <div class="ort">Bereichsleitung: ${ORGA_TELEFON}</div>
      ${lage(s).art === "reserve" ? `<span class="marke reserve">Du bist Reserve – danke!</span>` : ""}
      <div>${unten}</div>
    </div>`;
  }).join("");
  const springer = z.springer.length ? `<div class="karte"><h3>Springer</h3>
      <p>Du hilfst, wo gerade jemand fehlt: ${esc(z.springer.map(k => { const [d, tz] = k.split("|"); return `${tag(d).kurz} ${TAGESZEITEN.find(x => x.key === tz).name}`; }).join(", "))}</p>
      <button class="knopf klein warnung" data-aktion="kein-springer">Nicht mehr als Springer</button></div>` : "";
  return `${kopf(`Hallo ${esc(z.person.vorname || "")}!`)}
    ${z.meldung ? `<div class="hinweis gut">${z.meldung}</div>` : ""}
    ${z.abgemeldet && !eigene.length && !z.springer.length ? `<p>Du bist abgemeldet. Doch Zeit? Nimm einfach wieder Schichten dazu.</p>` : ""}
    <h2>Deine Schichten</h2>
    ${karten || springer ? karten + springer : `<p class="leise">Gerade keine.</p>`}
    <a class="knopf" href="#liste">Weitere Schicht dazunehmen</a>
    ${STUFEN.length ? `<h2>Deine Kudos</h2>
    <div class="karte">${kudosKarte()}</div>` : ""}
    <div class="karte">
      <h3>WhatsApp-Helfergruppe</h3>
      ${alter() !== null && alter() < 13
        ? `<p class="leise">WhatsApp erst ab 13.</p>`
        : z.whatsapp
          ? `<p>Die Einladung kommt an ${esc(z.person.handy)}.</p>
             <button class="knopf klein zweit" data-aktion="whatsapp-aus">Doch nicht einladen</button>`
          : `<p class="leise">News und Hilferufe. Freiwillig – Wichtiges kommt auch per Mail.</p>
             <button class="knopf klein zweit" data-aktion="whatsapp-an">Ja, ladet mich ein</button>`}
    </div>
    <div class="karte">
      <h3>Kalender</h3>
      <p class="leise">Ändert sich mit, wenn du umbuchst.</p>
      <a class="knopf klein zweit" href="#mein" data-aktion="kalender">In meinen Kalender</a>
    </div>
    <h2>Und sonst</h2>
    <a class="knopf zweit" href="#angaben">Meine Angaben ändern</a>
    ${z.offen === "alles" ? `<div class="hinweis">Von allen Schichten abmelden? Danke, dass du Bescheid sagst.</div>
        <button class="knopf warnung" data-aktion="ganz-abmelden">Ja, ganz abmelden</button>
        <button class="knopf zweit" data-aktion="nicht">Doch nicht</button>`
      : `<button class="knopf zweit" data-aktion="ganz-fragen" ${eigene.length || z.springer.length ? "" : "disabled"}>Ganz abmelden</button>`}
    ${z.offen === "loeschen" ? `<div class="hinweis warn">Alles löschen? Deine Schichten werden abgesagt. Das geht nicht rückgängig.</div>
        <button class="knopf warnung" data-aktion="loeschen">Ja, alles löschen</button>
        <button class="knopf zweit" data-aktion="nicht">Doch nicht</button>`
      : `<button class="knopf warnung" data-aktion="loeschen-fragen">Alle meine Daten löschen</button>`}
    ${fuss()}`;
};

// --- Prüfen beim Absenden ---------------------------------------------------

function personLesen(karte) {
  const p = {};
  karte.querySelectorAll("[data-feld]").forEach(el => {
    if (el.type === "radio") { if (el.checked) p[el.dataset.feld] = el.value; }
    else p[el.dataset.feld] = el.value.trim();
  });
  // Volljährig: Geburtsdatum und Eltern gar nicht erst behalten.
  if (p.volljaehrig === "ja") Object.assign(p, { geburt: "", eltern: "", elternmail: "" });
  return p;
}

function pruefen() {
  const f = [];
  const wer = (p, ich) => ich ? "Du" : `${p.vorname || "Die weitere Person"}`;
  const alle = [{ p: z.person, ich: true }].concat(z.weitere.map(p => ({ p, ich: false })));
  alle.forEach(({ p, ich }) => {
    if (!p.vorname || !p.nachname) f.push(ich ? "Bitte Vor- und Nachnamen angeben." : "Bitte für jede weitere Person Vor- und Nachnamen angeben.");
    if (!p.volljaehrig) f.push(ich ? "Bitte sag uns, ob du 18 oder älter bist." : `Bitte angeben, ob ${wer(p, ich)} 18 oder älter ist.`);
    if (p.volljaehrig === "nein" && !p.geburt) f.push(ich ? "Bitte dein Geburtsdatum angeben." : `Bitte das Geburtsdatum von ${wer(p, ich)} angeben.`);
    const a = alterDer(p);
    if (a !== null && a < 12) f.push(`${wer(p, ich)} ${ich ? "bist" : "ist"} leider noch zu jung – mithelfen geht ab 12 Jahren.`);
    if (a !== null && a >= 12 && a < 18 && (!p.eltern || !/^\S+@\S+\.\S+$/.test(p.elternmail || ""))) f.push(`Bitte Namen und Mail eines Elternteils angeben${ich ? "" : ` (für ${wer(p, ich)})`}.`);
    if (a !== null && a < 18 && z.auswahl.some(id => BEREICHE[schicht(id).bereich].abAlter)) f.push(`Shuttle geht erst ab 18. Bitte wähle dafür eine andere Schicht.`);
  });
  if (!/^\S+@\S+\.\S+$/.test(z.person.email || "")) f.push("Bitte eine E-Mail-Adresse angeben, an die wir die Bestätigung schicken können.");
  if (z.whatsapp && !z.person.handy) f.push("Für die Einladung in die WhatsApp-Gruppe brauchen wir deine Handynummer.");
  return [...new Set(f)];
}

// --- Aktionen ---------------------------------------------------------------

function formularLesen() {
  const ich = document.querySelector('[data-person="ich"]');
  if (!ich) return;
  z.person = Object.assign({}, z.person, personLesen(ich));
  z.weitere = z.weitere.map((p, i) => {
    const k = document.querySelector(`[data-person="${i}"]`);
    return k ? Object.assign({}, p, personLesen(k)) : p;
  });
  const bem = $("#bemerkung");
  if (bem) z.person.bemerkung = bem.value.trim();
  const stamm = $("#stamm");
  if (stamm) z.stamm = stamm.checked;
  const whatsapp = $("#whatsapp");
  if (whatsapp) z.whatsapp = whatsapp.checked;
  if (alter() !== null && alter() < 13) z.whatsapp = false;   // WhatsApp erst ab 13
}

const AKTIONEN = {
  neu: () => { z = LEER(); },
  zeit: el => {
    const k = el.dataset.key;
    z.zeit = z.zeit.includes(k) ? z.zeit.filter(x => x !== k) : z.zeit.concat(k);
  },
  "weiter-vorlieben": () => { location.hash = "#vorlieben"; },
  vorliebe: el => {
    const k = el.dataset.key;
    z.vorlieben = z.vorlieben.includes(k) ? z.vorlieben.filter(x => x !== k) : z.vorlieben.concat(k);
  },
  "weiter-vorschlaege": () => { location.hash = "#vorschlaege"; },
  waehlen: el => {
    const s = schicht(el.dataset.id);
    if (waehlbar(s).ok) z.auswahl = z.auswahl.concat(s.id);
    if (z.bestaetigt) z.meldung = `Eingetragen: ${BEREICHE[s.bereich].name}, ${zeitText(s)}.`;
  },
  abwaehlen: el => { z.auswahl = z.auswahl.filter(id => id !== el.dataset.id); },
  springer: () => { z.springer = z.zeit.slice(); },
  "kein-springer": () => { z.springer = []; },
  "filter-tag": el => { z.filterTag = el.dataset.key; },
  "filter-bereich": el => { z.filterBereich = el.dataset.key; },
  "person-dazu": () => { formularLesen(); z.weitere = z.weitere.concat({}); },
  "person-weg": el => { formularLesen(); z.weitere = z.weitere.filter((_, i) => i !== Number(el.dataset.i)); },
  absenden: () => {
    formularLesen();
    if (!z.auswahl.length && !z.springer.length) { z.fehler = ["Du hast noch keine Schicht gewählt."]; return; }
    z.fehler = pruefen();
    if (z.fehler.length) { window.scrollTo(0, 0); return; }
    if (z.bestaetigt) { z.meldung = "Deine Angaben sind gespeichert."; location.hash = "#mein"; return; }
    location.hash = "#fertig";
  },
  datenschutz: () => { alert("Im echten Werkzeug steht hier der Datenschutzhinweis: wer wir sind, wofür wir deine Daten nutzen, wie lange und welche Rechte du hast."); },
  "mail-simulieren": () => { z.bestaetigt = true; z.meldung = "Dein Platz ist fest. Schön, dass du dabei bist!"; location.hash = "#mein"; },
  "absagen-fragen": el => { z.offen = el.dataset.id; z.umbuchen = ""; },
  absagen: el => {
    const s = schicht(el.dataset.id);
    z.auswahl = z.auswahl.filter(id => id !== s.id);
    z.offen = "";
    z.meldung = `Abgesagt: ${BEREICHE[s.bereich].name}, ${zeitText(s)}. Danke fürs Bescheidsagen!`;
  },
  umbuchen: el => { z.umbuchen = el.dataset.id; z.offen = ""; },
  tauschen: el => {
    const neu = schicht(el.dataset.id);
    const alt = schicht(z.umbuchen);
    // Erst die neue nehmen, dann die alte freigeben (S-02).
    if (waehlbar(neu, alt.id).ok) {
      z.auswahl = z.auswahl.filter(id => id !== alt.id).concat(neu.id);
      z.meldung = `Umgebucht: jetzt ${BEREICHE[neu.bereich].name}, ${zeitText(neu)} – statt ${BEREICHE[alt.bereich].name}, ${zeitText(alt)}.`;
    }
    z.umbuchen = "";
  },
  nicht: () => { z.offen = ""; z.umbuchen = ""; },
  "ganz-fragen": () => { z.offen = "alles"; },
  "ganz-abmelden": () => {
    z.auswahl = []; z.springer = []; z.offen = ""; z.abgemeldet = true;
    z.meldung = "Du bist abgemeldet. Danke fürs Bescheidsagen!";
  },
  "loeschen-fragen": () => { z.offen = "loeschen"; },
  loeschen: () => { const leer = LEER(); leer.geloescht = true; z = leer; },
  "whatsapp-an": () => {
    z.whatsapp = true;
    if (z.person.handy) { z.meldung = "Gern – die WhatsApp-Einladung kommt an deine Handynummer."; return; }
    z.fehler = ["Für die Einladung in die WhatsApp-Gruppe brauchen wir deine Handynummer."];
    location.hash = "#angaben";
  },
  "whatsapp-aus": () => { z.whatsapp = false; z.meldung = "Alles klar – keine WhatsApp-Einladung."; },
  kalender: () => { alert("Im echten Werkzeug wird hier dein Kalender-Abo eingerichtet – es aktualisiert sich, wenn du umbuchst."); },
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-aktion]");
  if (!el) return;
  const aktion = AKTIONEN[el.dataset.aktion];
  if (!aktion) return;
  if (el.tagName === "BUTTON") ev.preventDefault();
  aktion(el);
  sichern();
  zeigen();
});

document.addEventListener("change", ev => {
  // Volljährig ja/nein und Geburtsdatum ändern, welche Felder gebraucht
  // werden (Geburtsdatum, Eltern, WhatsApp erst ab 13).
  if (ev.target.matches('[data-feld="geburt"], [data-feld="volljaehrig"]')) { formularLesen(); sichern(); zeigen(); }
});

// --- Anzeigen ---------------------------------------------------------------

let letzteSeite = "";

function zeigen() {
  const seite = (location.hash || "#start").slice(1);
  const bauen = SEITEN[seite] || SEITEN.start;
  if (seite !== letzteSeite) {
    // Meldungen gelten für die Seite, auf der sie entstanden sind.
    if (letzteSeite === "mein" && seite !== "mein") z.meldung = "";
    if (seite !== "angaben") z.fehler = [];
    z.offen = ""; z.umbuchen = "";
  }
  $("#app").innerHTML = bauen();
  if (seite !== letzteSeite) window.scrollTo(0, 0);
  letzteSeite = seite;
  sichern();
}

window.addEventListener("hashchange", zeigen);
zeigen();
</script>
</body>
</html>
