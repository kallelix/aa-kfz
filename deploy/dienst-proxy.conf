# Gehoert auf den nginx-Host nach /etc/nginx/snippets/abfahrt-dienst-proxy.conf
#
# Der einzige Proxy-Schnipsel, seit die drei Anwendungen ein Dienst sind.
# Host wird durchgereicht, weil der Dienst DARAN entscheidet, welcher Bereich
# antwortet - ohne die Zeile bekaeme er den Namen des Upstreams zu sehen und
# faende gar keinen.
#
# X-Forwarded-Proto ist nicht optional: daran erkennt die App, dass der Browser
# HTTPS sieht, und setzt erst dann das Secure-Flag am Session-Cookie.
#
# X-Forwarded-For haengt die echte Client-IP hinten an. uvicorn liest die Liste
# von hinten und nimmt den ersten Eintrag, der nicht in FORWARDED_ALLOW_IPS
# steht - selbst mitgeschickte Werte laufen damit ins Leere.

proxy_pass http://abfahrt;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
