# Gehoert auf den nginx-Host nach /etc/nginx/snippets/helfer-proxy.conf
#
# Inhaltlich dasselbe wie abfahrt-proxy.conf und presse-proxy.conf, nur mit
# anderem Upstream.
#
# X-Forwarded-Proto ist nicht optional: daran erkennt die App, dass der Browser
# HTTPS sieht, und setzt erst dann das Secure-Flag am Session-Cookie.
#
# X-Forwarded-For haengt die echte Client-IP hinten an. uvicorn liest die Liste
# von hinten und nimmt den ersten Eintrag, der nicht in FORWARDED_ALLOW_IPS
# steht - selbst mitgeschickte Werte laufen damit ins Leere.

proxy_pass http://helfer;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
