# nginx-Konfiguration für den zusammengesetzten Dienst
#
# Gehört auf den nginx-Host (nicht in den Container):
#   /etc/nginx/sites-available/abfahrt
#   ln -s ../sites-available/abfahrt /etc/nginx/sites-enabled/
#
# Die einzige nginx-Datei, seit die drei Anwendungen ein Dienst sind.
#
# Vorher anpassen:
#   - die vier Adressen
#   - 10.0.0.42            IP des Containers
#   - Zertifikatspfade, falls nicht certbot mit diesem Schema

# --- Rate Limit -------------------------------------------------------------
# Eine Zone statt drei: es ist ein Dienst und eine Anmeldeseite je Bereich.

map $request_method $abfahrt_post_ip {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $abfahrt_post_ip zone=abfahrt_login:10m rate=5r/m;

upstream abfahrt {
    server 10.0.0.42:8080;
    keepalive 8;
}

# --- HTTP: nur weiterleiten -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kennzeichen.example.de presse.example.de
                helfer.example.de admin.example.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Zur Kompression weiter unten: text/html steht ABSICHTLICH nicht in den
# gzip_types - nginx nimmt es ohnehin immer und warnt sonst. text/javascript
# muss dagegen mit hinein, nicht nur application/javascript: hinter
# proxy_pass kommt der Typ von der Anwendung, und Starlette liefert die
# Skripte unter dem ersten Namen aus.

# --- Öffentliche Adressen ---------------------------------------------------
#
# Drei Namen, ein Upstream. Welcher Bereich antwortet, entscheidet der Dienst
# am Host-Kopf - deshalb reicht ihn der Proxy-Schnipsel durch.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kennzeichen.example.de presse.example.de helfer.example.de;

    # HTTP/2 ist optional, bringt hier aber viel: der Monitor und das Tablet
    # fragen im Takt, und ihre Kopfzeilen wiegen mehr als die Antworten.
    #   nginx >= 1.25.1:  http2 on;
    #   nginx <  1.25.1:  listen 443 ssl http2;  (statt der Zeile oben)

    ssl_certificate     /etc/letsencrypt/live/kennzeichen.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kennzeichen.example.de/privkey.pem;

    access_log /var/log/nginx/abfahrt.access.log;
    error_log  /var/log/nginx/abfahrt.error.log;

    # Hochgeladen werden die beiden CSV-Dateien aus dem Registrierungstool.
    client_max_body_size 2m;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript
               application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # connect-src 'self' wegen Monitor und Unterschriften-Tablet: die holen
    # ihren Inhalt per fetch(). Ohne die Angabe faellt fetch auf
    # default-src 'none' zurueck und wird geblockt - der Monitor bliebe stumm
    # auf dem ersten Stand stehen, ohne sichtbaren Fehler.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # Das Backoffice hat hier nichts verloren - es liegt unter admin.…
    # Erreichbar waere es sonst trotzdem, weil derselbe Dienst antwortet.
    location ~ ^/(kennzeichen|presse|helfer)(/|$) {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/abfahrt-dienst-proxy.conf;
    }
}

# --- Backoffice -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.example.de;

    ssl_certificate     /etc/letsencrypt/live/admin.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.de/privkey.pem;

    access_log /var/log/nginx/abfahrt-admin.access.log;
    error_log  /var/log/nginx/abfahrt-admin.error.log;

    client_max_body_size 2m;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript
               application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # Eine Anmeldung fuer alle drei Bereiche, also drei Wege zu ihr. Das Rate
    # Limit gilt fuer alle gemeinsam - sonst haette man drei Versuche mal
    # drei Bereiche.
    location ~ ^/(kennzeichen|presse|helfer)/login$ {
        limit_req zone=abfahrt_login burst=5 nodelay;
        include /etc/nginx/snippets/abfahrt-dienst-proxy.conf;
    }

    location / {
        # Zweite Schicht. Eine der beiden Varianten einkommentieren, sobald
        # klar ist, von wo die Orga arbeitet. Sie gilt jetzt fuer alle drei
        # Bereiche auf einmal - vorher musste man daran dreimal denken.
        #
        # a) IP-Allowlist:
        # allow 203.0.113.0/24;
        # deny all;
        #
        # b) Basic Auth zusaetzlich zum App-Passwort:
        # auth_basic "Backoffice";
        # auth_basic_user_file /etc/nginx/abfahrt.htpasswd;
        #
        # ACHTUNG: nicht auf helfer.example.de ausdehnen - der Bildschirm im
        # Zelt und das Tablet am Ausgabetisch koennen kein Passwort eingeben.

        include /etc/nginx/snippets/abfahrt-dienst-proxy.conf;
    }
}
