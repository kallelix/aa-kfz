# nginx-Konfiguration fuer kennzeichen.example.de
#
# Gehoert auf den nginx-Host (nicht in den App-Container):
#   /etc/nginx/sites-available/kennzeichen.example.de
#   ln -s ../sites-available/kennzeichen.example.de /etc/nginx/sites-enabled/
#
# Vorher anpassen:
#   - 10.0.0.42        IP des LXC-Containers mit der App
#   - Zertifikatspfade, falls nicht certbot mit diesem Schema

# --- Rate Limits ------------------------------------------------------------
# Die zwei Zonen gehoeren in den http-Block. Stehen sie hier in einer Datei aus
# sites-enabled, ist das in Ordnung, solange die Datei nur einmal eingebunden
# wird - sonst meckert nginx ueber doppelte Zonen.

# Nur POST begrenzen. Bei GET ist der Schluessel leer, dann greift limit_req
# nicht: wer die Seite neu laedt oder das Formular nach einem Fehler noch einmal
# ausfuellt, soll nicht gegen die Wand laufen.
map $request_method $abfahrt_post_ip {
    POST    $binary_remote_addr;
    default "";
}

# 6 Antraege pro Minute und IP, mit Puffer fuer 10 Stueck am Stueck. Der Plan
# nennt 10 pro Stunde; das ist hier bewusst grosszuegiger, weil Helfer eines
# Vereins oft hinter derselben NAT-Adresse sitzen und sich sonst gegenseitig
# aussperren. Fuer strenger: rate=1r/m.
limit_req_zone $abfahrt_post_ip zone=abfahrt_formular:10m rate=6r/m;

# Zweite Schicht vor dem Login. Die App begrenzt selbst auf 5 Versuche pro
# Minute; das hier faengt schon davor ab.
limit_req_zone $abfahrt_post_ip zone=abfahrt_login:10m rate=5r/m;

# Die offene Durchfahrtsliste haengt nur am Token, deshalb hier auch GET
# begrenzen - 30 Aufrufe pro Minute und IP reichen an der Sperre dicke.
limit_req_zone $binary_remote_addr zone=abfahrt_offen:10m rate=30r/m;

limit_req_status 429;

upstream abfahrt {
    server 10.0.0.42:8080;
    keepalive 8;
}

# --- HTTP: nur weiterleiten -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kennzeichen.example.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kennzeichen.example.de;

    # HTTP/2 ist optional. Die Schreibweise haengt an der Version:
    #   nginx >= 1.25.1:  http2 on;
    #   nginx <  1.25.1:  listen 443 ssl http2;  (statt der Zeile oben)
    # Debian 12 liefert 1.22, deshalb steht hier die Variante, die ueberall
    # laeuft. Pruefen mit: nginx -v

    ssl_certificate     /etc/letsencrypt/live/kennzeichen.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kennzeichen.example.de/privkey.pem;

    access_log /var/log/nginx/kennzeichen.access.log;
    error_log  /var/log/nginx/kennzeichen.error.log;

    # Das Formular schickt ein paar hundert Byte. Alles darueber ist Unfug.
    client_max_body_size 64k;
    client_body_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Nur setzen, wenn die Subdomain dauerhaft per HTTPS erreichbar bleiben soll.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Serverseitig gerendertes HTML, keine externen Ressourcen. Das einzige
    # Skript ist /static/durchfahrt.js (Filtern der Durchfahrtsliste ohne Netz),
    # deshalb script-src 'self' und kein 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /admin/login {
        limit_req zone=abfahrt_login burst=5 nodelay;
        include /etc/nginx/snippets/abfahrt-proxy.conf;
    }

    location = / {
        limit_req zone=abfahrt_formular burst=10 nodelay;
        include /etc/nginx/snippets/abfahrt-proxy.conf;
    }

    # Offene Durchfahrtsliste: erreichbar ohne Anmeldung, nur durch den langen
    # Token geschuetzt. Ein Limit auf GET bremst das Durchprobieren, ohne dass
    # die Leute an der Sperre etwas davon merken - die laden die Seite einmal
    # und filtern danach im Browser.
    location /durchfahrt/ {
        limit_req zone=abfahrt_offen burst=20 nodelay;
        include /etc/nginx/snippets/abfahrt-proxy.conf;
    }

    location /admin {
        # Zweite Schicht, die der Plan empfiehlt. Eine der beiden Varianten
        # einkommentieren, sobald klar ist, von wo die Orga arbeitet.
        #
        # a) IP-Allowlist:
        # allow 203.0.113.0/24;
        # deny all;
        #
        # b) Basic Auth zusaetzlich zum App-Passwort:
        # auth_basic "Backoffice";
        # auth_basic_user_file /etc/nginx/abfahrt.htpasswd;

        include /etc/nginx/snippets/abfahrt-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/abfahrt-proxy.conf;
    }
}
