# nginx-Konfiguration fuer presse.example.de
#
# Gehoert auf den nginx-Host (nicht in den App-Container):
#   /etc/nginx/sites-available/presse.example.de
#   ln -s ../sites-available/presse.example.de /etc/nginx/sites-enabled/
#
# Vorher anpassen:
#   - presse.example.de   die tatsaechliche Adresse
#   - 10.0.0.43           IP des LXC-Containers mit der Presse-App
#   - Zertifikatspfade, falls nicht certbot mit diesem Schema

# --- Rate Limits ------------------------------------------------------------
# Eigene Zonen, damit sich die beiden Anwendungen nicht gegenseitig bremsen.
# Der map-Block heisst anders als in nginx-kennzeichen.conf: gleiche Namen
# zweimal zu definieren waere ein Konfigurationsfehler.

map $request_method $presse_post_ip {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $presse_post_ip zone=presse_formular:10m rate=6r/m;
limit_req_zone $presse_post_ip zone=presse_login:10m rate=5r/m;

upstream presse {
    server 10.0.0.43:8081;
    keepalive 8;
}

# --- HTTP: nur weiterleiten -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name presse.example.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name presse.example.de;

    # HTTP/2 ist optional. Die Schreibweise haengt an der Version:
    #   nginx >= 1.25.1:  http2 on;
    #   nginx <  1.25.1:  listen 443 ssl http2;  (statt der Zeile oben)

    ssl_certificate     /etc/letsencrypt/live/presse.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presse.example.de/privkey.pem;

    access_log /var/log/nginx/presse.access.log;
    error_log  /var/log/nginx/presse.error.log;

    # Das Formular schickt ein paar hundert Byte.
    client_max_body_size 64k;
    client_body_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Serverseitig gerendertes HTML, keine externen Ressourcen. Das einzige
    # Skript ist /static/liste.js (Filtern und Sortieren der Abholliste),
    # deshalb script-src 'self' und kein 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /admin/login {
        limit_req zone=presse_login burst=5 nodelay;
        include /etc/nginx/snippets/presse-proxy.conf;
    }

    location = / {
        limit_req zone=presse_formular burst=10 nodelay;
        include /etc/nginx/snippets/presse-proxy.conf;
    }

    location /admin {
        # Zweite Schicht. Eine der beiden Varianten einkommentieren, sobald
        # klar ist, von wo die Orga arbeitet.
        #
        # a) IP-Allowlist:
        # allow 203.0.113.0/24;
        # deny all;
        #
        # b) Basic Auth zusaetzlich zum App-Passwort:
        # auth_basic "Presse-Backoffice";
        # auth_basic_user_file /etc/nginx/presse.htpasswd;

        include /etc/nginx/snippets/presse-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/presse-proxy.conf;
    }
}
