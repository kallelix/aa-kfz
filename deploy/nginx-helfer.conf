# nginx-Konfiguration fuer helfer.example.de
#
# Gehoert auf den nginx-Host (nicht in den App-Container):
#   /etc/nginx/sites-available/helfer.example.de
#   ln -s ../sites-available/helfer.example.de /etc/nginx/sites-enabled/
#
# Vorher anpassen:
#   - helfer.example.de   die tatsaechliche Adresse
#   - 10.0.0.44           IP des LXC-Containers mit dem Helfer-Dashboard
#   - Zertifikatspfade, falls nicht certbot mit diesem Schema

# --- Rate Limits ------------------------------------------------------------
# Eigene Zonen mit eigenen Namen: gleiche Namen zweimal zu definieren waere
# ein Konfigurationsfehler, und die drei Anwendungen sollen sich nicht
# gegenseitig bremsen.

map $request_method $helfer_post_ip {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $helfer_post_ip zone=helfer_login:10m rate=5r/m;

upstream helfer {
    server 10.0.0.44:8082;
    keepalive 8;
}

# --- HTTP: nur weiterleiten -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name helfer.example.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name helfer.example.de;

    # HTTP/2 ist optional. Die Schreibweise haengt an der Version:
    #   nginx >= 1.25.1:  http2 on;
    #   nginx <  1.25.1:  listen 443 ssl http2;  (statt der Zeile oben)

    ssl_certificate     /etc/letsencrypt/live/helfer.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helfer.example.de/privkey.pem;

    access_log /var/log/nginx/helfer.access.log;
    error_log  /var/log/nginx/helfer.error.log;

    # Hochgeladen werden die beiden CSV-Dateien aus dem Registrierungstool.
    # Die echten sind zusammen unter 30 kB; 2 MB sind reichlich Luft.
    client_max_body_size 2m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # WICHTIG, Unterschied zu den beiden Schwester-Apps: connect-src 'self'.
    #
    # Die Monitoransicht holt sich ihren Inhalt per fetch() alle 60 Sekunden
    # selbst, damit der Bildschirm nicht staendig neu laedt. Ohne connect-src
    # faellt fetch auf default-src 'none' zurueck und wird geblockt - der
    # Monitor bliebe stumm auf dem ersten Stand stehen, ohne sichtbaren
    # Fehler ausser der Warnleiste.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /admin/login {
        limit_req zone=helfer_login burst=5 nodelay;
        include /etc/nginx/snippets/helfer-proxy.conf;
    }

    # Die Monitoransicht laeuft ohne Anmeldung, geschuetzt nur durch den
    # langen Token im Pfad. Kein Rate Limit: der Bildschirm fragt im Takt an
    # und wuerde sich sonst selbst aussperren.
    location /monitor/ {
        include /etc/nginx/snippets/helfer-proxy.conf;
    }

    location /admin {
        # Zweite Schicht. Eine der beiden Varianten einkommentieren, sobald
        # klar ist, von wo die Orga arbeitet.
        #
        # a) IP-Allowlist:
        # allow 203.0.113.0/24;
        # deny all;
        #
        # b) Basic Auth zusaetzlich zum App-Passwort:
        # auth_basic "Helfer-Backoffice";
        # auth_basic_user_file /etc/nginx/helfer.htpasswd;
        #
        # ACHTUNG: nicht auf /monitor/ ausdehnen - der Bildschirm im Zelt
        # kann kein Passwort eingeben.

        include /etc/nginx/snippets/helfer-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/helfer-proxy.conf;
    }
}
